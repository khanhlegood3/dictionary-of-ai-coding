name: Site

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck the site and the MCP server
        run: npx tsc --noEmit -p site
      - name: Check formatting
        run: npx prettier --check .
      - name: Build the site
        env:
          # Lets the build save a copy of the issue list for /tasks.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build
      - name: Check the MCP server the way a directory does
        run: npm run check:mcp
